# Runs the hooks from prek.toml, so the checks a developer gets from
# `prek install` also gate every pull request and every push to main.
name: prek

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pre-push and commit-msg stages need the commits of the range.
          fetch-depth: 0
          persist-credentials: false

      # Some hooks run scripts from the APM-deployed skills (.agents/skills/), which
      # are git-ignored: deploy them exactly as pinned in apm.lock.yaml.
      - name: Install APM
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          apm-version: "0.32.0"
          setup-only: true

      - name: Deploy the agent skills
        run: apm install --frozen

      - name: Install prek
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: "0.5.3" # keep in sync with minimum_prek_version in prek.toml
          install-only: true

      - name: Resolve the commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            from="$PR_BASE" to="$PR_HEAD"
          else
            from="$PUSH_BEFORE" to="$PUSH_AFTER"
          fi
          # A new branch or the first push has no "before": check the whole history.
          if [ -z "${from//0/}" ] || ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
            from=""
          fi
          echo "Range: ${from:-<root>}..${to}"
          {
            echo "RANGE_FROM=${from}"
            echo "RANGE_TO=${to}"
          } >> "$GITHUB_ENV"

      - name: pre-commit stage (all files)
        if: ${{ !cancelled() }}
        run: prek run --all-files --show-diff-on-failure --color=always

      - name: pre-push stage (commit range)
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RANGE_FROM" ]; then
            prek run --stage pre-push --color=always --from-ref "$RANGE_FROM" --to-ref "$RANGE_TO"
          else
            prek run --stage pre-push --color=always --all-files
          fi

      - name: commit-msg stage (each commit of the range)
        if: ${{ !cancelled() }}
        run: |
          msg="$RUNNER_TEMP/COMMIT_EDITMSG"
          failed=""
          for sha in $(git rev-list --no-merges --reverse "${RANGE_FROM:+$RANGE_FROM..}$RANGE_TO"); do
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            git log -1 --format=%B "$sha" > "$msg"
            prek run --stage commit-msg --color=always --commit-msg-filename "$msg" || failed="$failed $sha"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            for sha in $failed; do
              echo "::error::Commit $sha does not follow Conventional Commits"
            done
            exit 1
          fi
