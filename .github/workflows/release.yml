name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the package version is derived from the tags and the history (uv-dynamic-versioning)
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Check that the built version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/sealform-${expected}-py3-none-any.whl" ]; then
            ls dist
            echo "::error::built version does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
      - run: uv publish --trusted-publishing always
