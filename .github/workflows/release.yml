name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing, and the Sigstore signing of the attestations
      attestations: write # store the GitHub artifact attestations
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the package version is derived from the tags and the history (uv-dynamic-versioning)
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Check that the built version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/sealform-${expected}-py3-none-any.whl" ]; then
            ls dist
            echo "::error::built version does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
      # SLSA build provenance stored by GitHub, checked with `gh attestation verify`
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      # PEP 740 attestations (dist/<file>.publish.attestation), uploaded by uv publish and shown
      # as the provenance of each file on PyPI
      - run: uvx pypi-attestations@0.0.31 sign dist/*.whl dist/*.tar.gz
      - run: uv publish --trusted-publishing always
      # the exact files published to PyPI, with their PEP 740 attestations, are attached to the
      # GitHub release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    # only once the package is on PyPI, so a release never points at a missing version
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff needs the previous tag and the commits since then
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Generate the release notes (cliff.toml)
        run: uvx git-cliff@2.14.2 --current --strip all --output "$RUNNER_TEMP/notes.md"
        env:
          # resolves commit authors to GitHub users and their pull requests
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
