[project]
name = "sealform"
dynamic = ["version"]
description = "Manage SignPath.io organizations (projects, signing policies, artifact configurations, CI users) as code."
readme = "README.md"
license = "EPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Eclipse Foundation" }]
keywords = ["signpath", "code-signing", "configuration-as-code", "gitops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "ruamel.yaml>=0.18",
  "lxml>=5.2",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/eclipse-csi/sealform"
Issues = "https://github.com/eclipse-csi/sealform/issues"

[project.scripts]
sealform = "sealform.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "lxml-stubs>=0.5",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# The version comes from the latest vX.Y.Z git tag, as in otterdog: X.Y.Z on the tagged
# commit, the next minor as a .devN pre-release (N commits after the tag) elsewhere.
[tool.uv-dynamic-versioning]
vcs = "git"
latest-tag = true
# without git metadata (e.g. Dependabot's `uv lock`), build as 0.0.0 instead of failing
fallback-version = "0.0.0"
format-jinja = """
    {%- if distance == 0 -%}
        {{ serialize_pep440(base, stage, revision) }}
    {%- else -%}
        {{ serialize_pep440(bump_version(base, 1), stage, revision, dev=distance) }}
    {%- endif -%}
"""

[tool.uv]
# rebuild when the sources, the commit or the tags change (the version is derived from git, and
# `uv tool run --from <checkout>` builds a regular wheel that must not go stale)
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.py" },
  { file = "src/**/resources/*" },
  { git = { commit = true, tags = true } },
]
# pinned build backend (uv build / uv sync); refresh with:
#   printf '%s\n' hatchling uv-dynamic-versioning | uv pip compile - --no-annotate --no-header
build-constraint-dependencies = [
  "dunamai==1.26.5",
  "hatchling==1.33.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.7.0",
  "tomlkit==0.15.2",
  "trove-classifiers==2026.9.21.13",
  "uv-dynamic-versioning==0.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sealform"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude", "apm_modules", ".apm-local"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "RET"]
ignore = [
  "S101", # assert is fine in tests and for invariants
  "S603", # subprocess without shell is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sealform"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ruamel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "e2e: end-to-end tests against a real SignPath organization (opt-in, never uses developer tokens)",
]
