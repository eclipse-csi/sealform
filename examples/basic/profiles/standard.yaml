# yaml-language-server: $schema=../../../schemas/profile.schema.json
trusted_build_systems: [GitHub.com]
artifact_configurations:
  default:
    name: Default
    file: artifact-configurations/jar-signing.xml
signing_policies:
  test-signing:
    name: Test signing
    purpose: test
    certificate: test-certificate
    trusted_build_system_verification: true
    origin_verification:
      branches: ['*']
  release-signing:
    extends: signing-policies/release.yaml
